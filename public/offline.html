<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline — Work Timer</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #ecfeff 100%);
            text-align: center;
            padding: 2rem;
        }
        .box { max-width: 360px; }
        .icon {
            width: 88px; height: 88px; margin: 0 auto 1.25rem;
            border-radius: 22px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px -10px rgba(99,102,241,.5);
        }
        h1 { font-size: 1.35rem; color: #312e81; margin: 0 0 .5rem; }
        p { color: #6b7280; margin: 0 0 1.5rem; line-height: 1.5; }
        button {
            border: none; padding: .8rem 1.75rem; border-radius: 999px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
            font-weight: 600; font-size: 1rem; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
                <circle cx="12" cy="13" r="8"></circle>
                <path d="M12 9v4l2.5 1.5"></path>
                <path d="M9 3h6"></path>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>Work Timer needs a connection to load or save time logs. Reconnect and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
